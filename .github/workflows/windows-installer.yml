name: Quick Windows installer
# Builds only the Windows installer, without the test suites, when a
# test build is needed quickly. The full checks stay in build.yml.
on:
  workflow_dispatch:
  push:
    branches: [windows-installer]
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13.16 --group dev
      - run: npm ci
      - run: npm run build
      - run: uv run python scripts/collect_licenses.py
      - run: uv run python scripts/build_runtime.py
      - run: uv run python scripts/runtime_smoke.py
      - run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: booster-recruiter-windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
