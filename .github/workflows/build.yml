name: Build and validate desktop applications
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secrets:
    name: Scan source history for credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/booster-secret-scan"
          mkdir -p "$scanner_dir"
          curl --fail --location --retry 3 \
            --output "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" version
      - name: Scan all fetched source history
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/booster-secret-scan"
          : > "$scanner_dir/empty-ignore"
          "$scanner_dir/gitleaks" git . \
            --config .github/gitleaks.toml \
            --log-opts=--all \
            --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$scanner_dir/empty-ignore" \
            --redact --no-banner --no-color
  build:
    needs: secrets
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13.16 --group dev
      - run: uv run python scripts/check_repository.py
      - run: npm ci
      - run: uv run pytest
      - run: npm run build
      - run: uv run python scripts/collect_licenses.py
      - run: uv run python scripts/build_runtime.py
      - run: uv run python scripts/runtime_smoke.py
      - run: npm run test:ui
      - if: runner.os == 'macOS'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: npm run package:win
      - name: Verify packaged Mac application with isolated test data
        if: runner.os == 'macOS'
        run: npm run test:ui
        env:
          BOOSTER_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/Booster Recruiter.app/Contents/MacOS/Booster Recruiter
      - name: Verify packaged Windows application with isolated test data
        if: runner.os == 'Windows'
        run: npm run test:ui
        env:
          BOOSTER_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\Booster Recruiter.exe
      - uses: actions/upload-artifact@v4
        with:
          name: booster-recruiter-${{ runner.os }}-${{ github.sha }}-acceptance
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
