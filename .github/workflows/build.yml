name: Build and validate desktop applications
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: npm ci
      - run: uv run pytest
      - run: npm run build
      - run: uv run python scripts/collect_licenses.py
      - run: uv run python scripts/build_runtime.py
      - run: uv run python scripts/runtime_smoke.py
      - run: npm run test:ui
      - if: runner.os == 'macOS'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: booster-recruiter-${{ runner.os }}-unsigned-test
          path: release/
          retention-days: 14
