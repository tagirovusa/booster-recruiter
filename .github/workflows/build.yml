name: Build and validate desktop applications
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.13.16 --group dev
      - run: npm ci
      - run: uv run pytest
      - run: npm run build
      - run: uv run python scripts/collect_licenses.py
      - run: uv run python scripts/build_runtime.py
      - run: uv run python scripts/runtime_smoke.py
      - run: npm run test:ui
      - if: runner.os == 'macOS'
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'Windows'
        run: npm run package:win
      - name: Verify packaged Mac application with isolated test data
        if: runner.os == 'macOS'
        run: npm run test:ui
        env:
          BOOSTER_EXECUTABLE: ${{ github.workspace }}/release/mac-arm64/Booster Recruiter.app/Contents/MacOS/Booster Recruiter
      - name: Verify packaged Windows application with isolated test data
        if: runner.os == 'Windows'
        run: npm run test:ui
        env:
          BOOSTER_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\Booster Recruiter.exe
      - uses: actions/upload-artifact@v4
        with:
          name: booster-recruiter-${{ runner.os }}-${{ github.sha }}-acceptance
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7
