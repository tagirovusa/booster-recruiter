[project]
name = "booster-linkedin-runtime"
version = "4.29.0+booster.1"
description = "Business Booster browser runtime for LinkedIn recruiting workflows."
readme = "README.md"
requires-python = ">=3.12.4,<3.15"
authors = [{ name = "Daniil Tagirov" }]
maintainers = [{ name = "Business Booster" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["business-booster", "recruiting", "linkedin", "mcp"]
dependencies = [
  "anyio>=4.13.0",
  "cryptography>=50.0.1",
  "fastmcp>=4.1.2,<5",
  "httpx2>=2.13.1,<3",
  "inquirer>=3.4.0",
  "mcp>=2.2.0,<3",
  "opentelemetry-api>=1.45.1",
  "packaging>=26.2",
  "patchright>=1.55.0",
  "pydantic-settings>=2.14.2",
  "python-dotenv>=1.1.1",
  "pywin32>=312 ; sys_platform == 'win32'",
  "rich>=15.0.0",
  "starlette>=1.3.1"
]

[project.urls]
Repository = "https://github.com/t4god/booster-recruiter"
Documentation = "https://github.com/t4god/booster-recruiter/blob/main/README.md"
Issues = "https://github.com/t4god/booster-recruiter/issues"

[project.scripts]
booster-linkedin-runtime = "booster_linkedin.cli_main:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["booster_linkedin*"]

[tool.setuptools.package-data]
booster_linkedin = ["py.typed", "linkedin/photo_frame_ocr.swift"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
